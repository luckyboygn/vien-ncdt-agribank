<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Nội Dung - Viện Nghiên cứu và Đào tạo</title>
    <meta name="description" content="Trang quản trị nội dung cho Viện Nghiên cứu và Đào tạo để cập nhật tin tức, cấu trúc tổ chức và thông tin liên hệ.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="admin-container">
        <section id="login-form" style="display: block;">
            <h2 style="text-align:center; margin:50px 0 20px;">Đăng nhập với GitHub Token</h2>
            <p style="text-align:center; margin-bottom:20px;">Vì lý do bảo mật, token không được lưu lại, vui lòng đăng nhập lại nếu tải lại trang.</p>
            <div style="max-width:400px; margin:0 auto; padding:20px; border:1px solid #ddd; border-radius:8px;">
                <input type="text" id="github-token" placeholder="GitHub Personal Access Token" required style="width:100%; padding:10px; margin-bottom:10px;"><br>
                <input type="text" id="repo-name" placeholder="Tên repo (username/reponame)" required style="width:100%; padding:10px; margin-bottom:10px;"><br>
                <button onclick="login()" style="width:100%;">Đăng nhập</button>
            </div>
        </section>

        <section id="admin-panel" style="display: none;">
            <!-- Tabs quản trị sẽ được thêm vào đây bởi JavaScript -->
        </section>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
